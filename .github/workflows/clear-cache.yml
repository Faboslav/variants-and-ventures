name: "Clear cache"

on:
    workflow_dispatch:

jobs:
    clear-cache:
        runs-on: ubuntu-latest
        name: "Clear cache"
        timeout-minutes: 60
        steps:
            -   uses: MyAlbum/purge-cache@881eb5957687193fa612bf74c0042adc78ea5e54 # v2
                with:
                    accessed: true
                    created: true
                    max-age: 0